name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            infra/requirements.txt

      # The CDK libraries run on a JavaScript runtime under the hood.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt -r infra/requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
